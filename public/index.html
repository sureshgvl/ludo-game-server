<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ludo</title>
  <link rel="icon" href="data:,">
  <style>
    :root { --bg:#f4f1ea; --ink:#1f2430; --muted:#6b7280; --card:#fff; --line:#e2ddd0; --accent:#3f51b5; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
    header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); }
    header h1 { font-size:18px; margin:0; }
    header .who { margin-left:auto; color:var(--muted); font-size:13px; }
    #tabs { display:flex; gap:6px; padding:10px 16px 0; flex-wrap:wrap; }
    .tab { border:1px solid var(--line); background:#ebe7da; padding:7px 12px; border-radius:8px 8px 0 0; cursor:pointer; font-size:14px; }
    .tab.active { background:var(--card); border-bottom-color:var(--card); font-weight:600; }
    .tab .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#ef6c00; margin-left:6px; }
    main { padding:0 16px 24px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:0 10px 10px 10px; padding:16px; }
    .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:8px 0; }
    label { font-size:13px; color:var(--muted); }
    input, select { padding:8px 10px; border:1px solid #cfc9b8; border-radius:8px; font-size:15px; }
    button { padding:9px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
    button.secondary { background:#e8e4d6; color:var(--ink); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #error { color:#b3261e; min-height:20px; margin-top:8px; font-size:14px; }
    #game { display:none; gap:18px; flex-wrap:wrap; align-items:flex-start; }
    #boardwrap { flex:1 1 360px; max-width:620px; }
    canvas { width:100%; height:auto; border-radius:10px; border:1px solid var(--line); touch-action:manipulation; background:#fff; }
    #side { flex:1 1 260px; max-width:360px; }
    #status { font-size:17px; font-weight:600; min-height:46px; }
    #dice { font-size:54px; line-height:1; margin:6px 0; }
    .players { margin:10px 0; display:flex; flex-direction:column; gap:6px; }
    .pl { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-size:14px; }
    .pl.turn { border-color:var(--accent); background:#eef0fb; }
    .chip { width:14px; height:14px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.35); }
    .tag { font-size:11px; background:#eee; border-radius:6px; padding:1px 6px; color:#555; }
    #log { font-size:13px; color:var(--muted); max-height:120px; overflow:auto; margin-top:8px; }
    #over { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:5; }
    #over .box { background:#fff; padding:22px 26px; border-radius:14px; min-width:260px; }
    #over h2 { margin:0 0 10px; }
    #over ol { padding-left:20px; margin:0 0 14px; }
    .hint { font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>Ludo</h1>
    <span class="hint">Play up to 3 games at once</span>
    <span class="who" id="who"></span>
  </header>
  <div id="tabs"></div>
  <main>
    <div class="panel">
      <div id="lobby">
        <div class="row">
          <label for="name">Your name</label>
          <input id="name" maxlength="20" placeholder="Player">
          <label for="players">Players</label>
          <select id="players"><option value="2">2 players</option><option value="4">4 players</option></select>
        </div>
        <div class="row">
          <button id="quick">Quick match</button>
          <button id="private" class="secondary">Create private room</button>
        </div>
        <div class="row">
          <input id="code" placeholder="Room code" size="14">
          <button id="join" class="secondary">Join with code</button>
        </div>
        <div class="hint">Quick match waits about 20 seconds for other players, then bots fill the empty seats.</div>
        <div id="error"></div>
      </div>

      <div id="game">
        <div id="boardwrap"><canvas id="board" width="600" height="600"></canvas></div>
        <div id="side">
          <div id="status"></div>
          <div id="dice"></div>
          <div class="row">
            <button id="roll">Roll dice</button>
            <button id="start" class="secondary">Start now</button>
            <button id="leave" class="secondary">Leave game</button>
          </div>
          <div class="hint" id="roomline"></div>
          <div class="players" id="players-list"></div>
          <div id="log"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="over"><div class="box"><h2>Game over</h2><ol id="ranking"></ol><button id="closeGame">Close game</button></div></div>

  <script src="/vendor/colyseus.js"></script>
  <script src="/app.js"></script>
</body>
</html>
