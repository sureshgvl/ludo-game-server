# Render Blueprint: creates the game server (WebSockets + web client).
# Redis is optional: without REDIS_URL the 3-game limit is kept in memory, which is fine for ONE instance.
# Add a REDIS_URL env var in Render if you ever run more than one instance.
services:
  - type: web
    name: ludo-game-server
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # URL of the deployed ludo-api, e.g. https://ludo-api.onrender.com
      - key: API_URL
        sync: false
      # Must be the same value as INTERNAL_API_KEY on ludo-api.
      - key: GOOGLE_CLIENT_ID
        sync: false # web OAuth client ID (public)
      - key: JWT_SECRET
        sync: false # same value as on ludo-api
      - key: INTERNAL_API_KEY
        sync: false

